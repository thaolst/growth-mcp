[project]
name = "growth-mcp"
version = "0.1.0"
description = "MCP server for growth marketing — campaign design, retention analysis, churn prediction"
authors = [{ name = "Tara Le", email = "tienthaotara@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/thaolst/growth-mcp"
Repository = "https://github.com/thaolst/growth-mcp"

[project.scripts]
growth-mcp = "growth_mcp.server:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["growth_mcp*"]
